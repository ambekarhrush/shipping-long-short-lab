name: FleetWatch collector
# Hourly AIS snapshot of the listed fleets. Each run listens for ~8 minutes, keeps only
# messages for ships in data/reference/fleet_register.csv, rebuilds the identity table and
# daily states, and commits the new files. The commit timestamps are the audit trail that
# every signal was recorded before the companies reported.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fleetwatch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Listen to AIS
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: uv run python -m shiplab.fleet.ais --minutes 8
      - name: Rebuild identity and daily states
        run: uv run python -m shiplab.fleet.update
      - name: Commit
        run: |
          git config user.name "fleetwatch-bot"
          git config user.email "fleetwatch-bot@users.noreply.github.com"
          git add data/fleet
          git diff --cached --quiet || git commit -m "FleetWatch snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
